<!DOCTYPE html>
<!--
  Chemistry by Design — route viewer (standalone).
  Generated by dashboard/build_static.py — open this file directly in a browser;
  no server or install needed. Everything (data, RDKit.js, Cytoscape) is inline.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chemistry by Design — Viewer</title>

  <script>
  // ===================== CONFIG — safe to edit by hand =====================
  // repo:   GitHub "owner/name" used by the "Open issue" / "Suggest a fix (PR)" links
  // branch: branch the PR link edits        email: address for "Email" ("" hides it)
  // dataPath: folder of the route JSON files inside the repo
  // liveCheck / liveDataUrl: when a route is opened, the viewer looks for its JSON
  //   file at <liveDataUrl>/<route>.json (relative to this page, or a full URL) and
  //   marks what has changed since this page was built. false / "" turns that off.
  window.DASH_CONFIG = /*__CONFIG__*/;
  // ==========================================================================
  </script>

  <style>
/*__CSS__*/

/* ---- loading screen, about, reporting ---- */
#loading {
  position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center;
  justify-content: center; flex-direction: column; gap: 10px;
  background: var(--bg); color: var(--text); font-size: 14px;
}
#loading .spinner {
  width: 28px; height: 28px; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--accent);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading.error .spinner { display: none; }
.report-details > summary { color: var(--accent); }
.report-details > summary:hover { color: var(--accent-dark); }
.report-box { margin-top: 16px; }
.report-box textarea { width: 100%; min-height: 70px; margin: 6px 0 8px; padding: 6px 8px;
  border: 1px solid var(--border); border-radius: 6px; font: inherit; font-size: 13px; resize: vertical; }
.report-box textarea:focus { outline: none; border-color: var(--accent); }
.report-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.report-actions a { text-decoration: none; }
.report-actions a.btn:not(.btn-primary) { color: var(--text); }
#btn-report, .report-actions a[data-link="issue"] {
  border-color: var(--accent); color: #fff; background-color: var(--accent);
  transition: background-color 150ms ease, border-color 150ms ease;
}
#btn-report:hover, .report-actions a[data-link="issue"]:hover {
  background-color: var(--accent-dark); border-color: var(--accent-dark);
}
.about { font-size: 11px; color: rgba(255,255,255,0.85); margin-top: 6px; }
.about a { color: #fff; }

/* ---- changed in the route file since this page was built (purple) ---- */
.live-note { margin-top: 10px; font-size: 12px; line-height: 1.45; border-radius: 7px; padding: 8px 10px;
  background: #f6edfb; border: 1px solid #d9bdea; color: #4f2468; max-height: 120px; overflow-y: auto; }
.live-note.same { margin-top: 6px; padding: 0; background: none; border: 0; color: var(--muted); font-size: 11px; }
.live-note.warn { background: #fff7e6; border-color: #ffe0a3; color: #8a6100; }
.live-note code { font-size: 11px; word-break: break-all; }
.live-ink { color: #8e44ad; }
.live-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.live-chip { font: inherit; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
  cursor: pointer; border: 1px solid #8e44ad; background: #fff; color: #6c2f8a; }
.live-chip:hover { background: #8e44ad; color: #fff; }
.live-gone { margin-top: 6px; }
.live-badge { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
  font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  background: #8e44ad; color: #fff; vertical-align: middle; }
.live-box { margin: 0 0 14px; padding: 8px 10px; border: 1px solid #d9bdea; border-left: 4px solid #8e44ad;
  border-radius: 8px; background: #faf5fd; font-size: 12px; }
.live-title { font-weight: 700; color: #4f2468; }
.live-row { margin-top: 6px; }
.live-row .thumb-row { align-items: center; }
.live-tag { min-width: 46px; font-size: 10px; font-weight: 700; text-transform: uppercase; color: #6c2f8a; }
.live-tag.was { color: var(--muted); }
.reagent-thumb.live-add { border: 2px solid #8e44ad; }
.reagent-thumb.live-del { border-style: dashed; opacity: 0.6; }
.live-before { margin-top: 4px; font-size: 11.5px; color: var(--muted); word-break: break-all; }
.live-before span { margin-right: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.reagent-card.live-changed { border-color: #8e44ad; box-shadow: inset 3px 0 0 #8e44ad; }

/* ---- route info: its own panel on the right ("Route info" button shows / hides it) ---- */
#app {
  grid-template-columns: var(--left, 280px) 4px minmax(220px, 1fr) 4px clamp(260px, var(--right, 440px), 60vw);
  grid-template-areas:
    "sidebar left main   right info"
    "sidebar left bottom right info"
    "sidebar left panel  right info";
}
#app.info-closed {
  grid-template-columns: var(--left, 280px) 4px minmax(220px, 1fr);
  grid-template-areas: "sidebar left main" "sidebar left bottom" "sidebar left panel";
}
#gutter-r { grid-area: right; }
#info { grid-area: info; min-width: 0; min-height: 0; overflow-y: auto; background: var(--panel-bg); }
#app.info-closed #info, #app.info-closed #gutter-r { display: none; }
#info-content { padding: 16px; }
#info .panel-img { max-height: 220px; }

/* ---- complexity evolution chart (route info) ---- */
#cv-metric { display: block; margin-bottom: 8px; font: inherit; font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--text);
  padding: 2px 6px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
#cv-chart { display: block; width: 100%; max-width: 520px; height: auto; }
#cv-chart text { font-size: 11px; fill: #6b7280; }
#cv-chart .cv-axis { stroke: #8a8f9c; stroke-width: 1; }
#cv-chart .cv-grid { stroke: #eceef3; stroke-width: 1; }
#cv-chart .cv-seg { stroke: #f4c430; stroke-width: 2.5; stroke-linecap: round; }
#cv-chart .cv-seg.sel { stroke: #111; stroke-width: 3.5; }
#cv-chart .cv-seg.on { stroke: #cf6a1a; stroke-width: 4.5; }
#cv-chart .cv-pt { fill: #fff; stroke-width: 2; }
#cv-chart .cv-pt.sel { r: 5.5; stroke: #111; stroke-width: 3; }
#cv-chart .cv-pt.on { r: 6; fill: #fbe0c8; stroke-width: 3; }
#cv-chart .cv-hit { fill: transparent; stroke: transparent; cursor: pointer; }
#cv-chart line.cv-hit { stroke-width: 12; stroke-linecap: round; }
  </style>

  <!-- Vendored libs (load order matters: dagre -> cytoscape -> cytoscape-dagre) -->
  <!--__VENDOR__-->
  <!--__RDKIT_JS__-->
</head>
<body>
  <div id="loading"><div class="spinner"></div><div id="loading-msg">Loading chemistry engine…</div></div>

  <div id="app">
    <!-- Left: route list -->
    <aside id="sidebar">
      <div class="sidebar-head">
        <h1>Chemistry by Design</h1>
        <input id="route-bgname" type="text" placeholder="Search compound name…" autocomplete="off" />
        <details id="route-filters" class="route-filters">
          <summary>Filter by author &amp; year</summary>
          <label class="route-filter-label" for="route-author">Author</label>
          <select id="route-author"><option value="">All authors</option></select>
          <div class="route-year-range">
            <label class="route-filter-label" for="route-year-from">Earliest year
              <input id="route-year-from" type="number" min="1" max="9999" step="1" placeholder="Any" />
            </label>
            <label class="route-filter-label" for="route-year-to">Latest year
              <input id="route-year-to" type="number" min="1" max="9999" step="1" placeholder="Any" />
            </label>
          </div>
          <p id="route-filter-error" class="route-filter-error" role="status" hidden></p>
          <button id="route-filter-reset" class="route-filter-reset" type="button">Clear filters</button>
        </details>
        <div id="about" class="about"></div>
      </div>
      <ul id="route-list"></ul>
      <p id="route-empty" class="route-empty" role="status" hidden>No routes match these filters.</p>
    </aside>

    <div class="gutter" id="gutter-l" data-side="left" title="drag to resize"></div>

    <!-- Top: graph -->
    <main id="main">
      <header id="route-header">
        <div id="route-title">Select a route to begin</div>
        <div id="route-meta" class="muted"></div>
        <div id="route-tools" class="hidden">
          <button id="btn-info" class="btn" title="Show / hide the route info panel on the right">Route info</button>
          <button id="btn-abbr" class="btn" title="Toggle group abbreviations (Bn, Boc, OMe, PEG6, …)">Abbrev: on</button>
          <button id="btn-color" class="btn" title="Toggle element colours for heteroatoms (O red, N blue, …) vs all-black">Colored atoms: off</button>
          <button id="btn-map" class="btn" title="Show / hide atom-map numbers in reaction drawings">Atom maps: off</button>
          <button id="btn-report" class="btn" title="Found an error in this route? Tell us by e-mail, GitHub issue, or a pull request">Report a mistake</button>
        </div>
        <div id="warnings" class="warnings hidden"></div>
        <div id="live-note" class="live-note hidden"></div>
      </header>
      <div id="graph-wrap">
        <div id="cy"></div>
      </div>
    </main>

    <div class="gutter" id="gutter-b" data-side="bottom" title="drag to resize info panel height"></div>

    <!-- Bottom: detail panel (read-only) -->
    <aside id="panel" class="empty">
      <div id="panel-empty" class="muted panel-pad">
        Click a node to view more details.
      </div>
      <div id="panel-content" class="hidden"></div>
    </aside>

    <div class="gutter" id="gutter-r" data-side="right" title="drag to resize"></div>

    <!-- Right: route info (target, complexity chart, reference); toggled by "Route info" -->
    <aside id="info">
      <div id="info-content"><div class="muted">Select a route to see its target, complexity chart and reference.</div></div>
    </aside>
  </div>

  <div id="tooltip" class="hidden"></div>

  <!-- click-to-enlarge lightbox for the reaction/molecule image -->
  <div id="lightbox" class="hidden">
    <img id="lightbox-img" alt="enlarged" />
  </div>

  <!-- Data: route index (plain JSON) + one gzipped, base64'd JSON per route. -->
  <script id="route-index" type="application/json">__INDEX__</script>
  <script id="route-data" type="application/json">__ROUTES__</script>
  <script id="rdkit-wasm" type="application/octet-stream">__RDKIT_WASM__</script>

  <script>
/*__APP_JS__*/
  </script>
</body>
</html>
